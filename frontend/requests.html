<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KisanLink - Requests</title>

    <link rel="stylesheet" href="css/requests.css">
</head>

<body>

    <header class="topbar">

        <a href="farmer-dashboard.html" class="back-btn">
            ← Dashboard
        </a>

        <div class="brand">
            🌾 KisanLink
        </div>

        <div class="top-user">
            <span id="topUserName">Loading...</span>
        </div>

    </header>


    <main class="requests-container">

        <section class="page-heading">

            <div>
                <p class="eyebrow">KISANLINK MARKETPLACE</p>

                <h1 id="pageTitle">
                    Buyer Requests
                </h1>

                <p id="pageSubtitle">
                    Manage incoming crop purchase requests
                </p>
            </div>

            <div class="request-count">
                <strong id="requestCount">0</strong>
                <span>Requests</span>
            </div>

        </section>


        <section id="requestsFeed" class="requests-feed">

            <div class="loading-card">
                <div class="loader"></div>
                <p>Loading requests...</p>
            </div>

        </section>

    </main>


    <script src="js/requests.js?v=2"></script>

</body>

</html>
